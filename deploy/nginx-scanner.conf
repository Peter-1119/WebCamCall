# 放進現有 nginx 的 server {} 區塊裡（HTTPS 的那個）。
# 前提：該 server 已經有 ssl_certificate / ssl_certificate_key。
#
# 掛在 https://<host>/scanner/ 底下；build 時要用 PLAYGROUND_BASE=/scanner/。
# 若要掛在根路徑，把 location 改成 "/"、alias 改成 root，build 時不設 PLAYGROUND_BASE。

location /scanner/ {
    alias /var/www/scanner/;
    index index.html;
    try_files $uri $uri/ /scanner/index.html;

    # 相機權限：絕對不能有 Permissions-Policy: camera=() 這種 header 擋掉
    # （若上層 server 區塊有全域的 Permissions-Policy，這裡要覆寫）
    add_header Permissions-Policy "camera=(self)" always;

    # Phase 3 之後會有 Worker 與 .wasm；wasm 一定要正確的 MIME 才能 streaming compile
    types {
        application/wasm  wasm;
        text/javascript   js mjs;
        text/css          css;
        text/html         html;
        image/png         png;
        image/svg+xml     svg;
    }

    # 測試期間不要快取，改完重佈署馬上生效
    add_header Cache-Control "no-store" always;
}
