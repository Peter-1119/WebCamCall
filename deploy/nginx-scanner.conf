    # ==========================================
    # 專案 F：Barcode Scanner playground（純靜態）
    #   對外：https://sfserver.flexium.com.tw/scanner/
    #   build 時要用 PLAYGROUND_BASE=/scanner/
    # ==========================================
    location = /scanner { return 301 /scanner/; }

    location /scanner/ {
        alias /var/www/scanner/;
        index index.html;
        try_files $uri $uri/ /scanner/index.html;

        # 相機權限：不能被 Permissions-Policy 擋掉
        add_header Permissions-Policy "camera=(self)" always;
        # 測試期間不快取，重佈署馬上生效
        add_header Cache-Control "no-store" always;

        # 舊版 nginx 的 mime.types 沒有 wasm，補上。
        # 注意：location 內的 types 是「整份取代」，所以一定要先 include 完整表再補，
        # 兩行缺一不可（只寫第二行會讓 JS/CSS 變 text/plain）。更好的做法是改全域 mime.types，見 docs/deploy.md。
        include /etc/nginx/mime.types;
        types { application/wasm wasm; }
    }
