    # ==========================================
    # 專案 F：Barcode Scanner playground（純靜態）
    #   對外：https://sfserver.flexium.com.tw/scanner/
    #   build 時要用 PLAYGROUND_BASE=/scanner/
    # ==========================================
    location = /scanner { return 301 /scanner/; }

    location /scanner/ {
        alias /var/www/scanner/;
        index index.html;
        try_files $uri $uri/ /scanner/index.html;

        # 相機權限：不能被 Permissions-Policy 擋掉
        add_header Permissions-Policy "camera=(self)" always;
        # 測試期間不快取，重佈署馬上生效
        add_header Cache-Control "no-store" always;

        # Phase 3 之後會有 .wasm；舊版 nginx 的 mime.types 沒有 wasm，補上
        # （types 會累加；若 mime.types 已有 wasm 只會出現 duplicate 警告，無害）
        include /etc/nginx/mime.types;
        types { application/wasm wasm; }
    }
